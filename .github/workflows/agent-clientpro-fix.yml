name: Agent ClientPro hardening

on:
  push:
    branches:
      - agent/security-hardening-tour-v1-5-0

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Apply guarded patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_clientpro_hardening.py
          python3 /tmp/apply_clientpro_hardening.py
      - name: Sync version
        run: node scripts/sync-version.mjs
      - name: Unit and policy checks
        run: |
          npm test
          npm run check:version
          node scripts/check-policy.mjs
          node --check sw.js
          find assets scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Commit validated changes
        run: |
          rm -f .github/workflows/agent-clientpro-fix.yml
          git config user.name "ClientPro Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): harden crypto migrations and refresh tour"
          git push origin HEAD
