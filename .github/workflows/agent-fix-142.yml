name: Agent fix 1.4.2

on:
  push:
    branches:
      - agent/security-race-tour-1-4-2

permissions:
  contents: write

concurrency:
  group: agent-fix-1-4-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-fix-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-race-tour-1-4-2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Apply guarded patch
        shell: bash
        run: |
          cat scripts/.agent-fix-142/part* | base64 -d | gzip -d > /tmp/agent_fix_142.py
          rm -rf scripts/.agent-fix-142
          python3 /tmp/agent_fix_142.py
          node scripts/sync-version.mjs

      - name: Static checks
        shell: bash
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool vercel.json > /dev/null
          node --check sw.js
          find assets scripts tests e2e -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node scripts/sync-version.mjs --check
          node scripts/check-policy.mjs
          git diff --check

      - name: Unit tests
        run: node --test 'tests/**/*.test.js'

      - name: Install E2E tooling
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E and axe
        run: npx playwright test

      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Verify final scope
        shell: bash
        run: |
          test ! -e .github/workflows/agent-fix-142.yml
          test ! -e scripts/agent_fix_142.py
          test ! -e scripts/.agent-fix-142
          git status --short
          git diff --check

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden crypto sessions and rebuild onboarding [agent-fix-done]'
          git push origin HEAD:agent/security-race-tour-1-4-2
