name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Plan scope compares the PR against locked baseline c4264af.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool vercel.json > /dev/null
          python3 -m json.tool lighthouserc.json > /dev/null

      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          find assets scripts tests e2e -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Verify version single-source (package.json → manifest/sw/pwa/README)
        run: node scripts/sync-version.mjs --check

      - name: Verify repo policy (debug scaffold / cache-buster / self-host)
        run: node scripts/check-policy.mjs

      - name: Verify locked implementation scope
        run: node scripts/check-plan-scope.mjs

  tests:
    name: Automated tests (crypto, data integrity, detector fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Runtime remains zero-dependency. Unit tests use Node built-ins and the
      # production detector core exported by document-detector.worker.js.
      - name: Run test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'

  e2e:
    name: E2E + a11y + offline scanner + Lighthouse gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install CI test tooling
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E + axe a11y + offline service-worker path
        run: npx playwright test

      - name: Lighthouse CI hard floor
        run: npx lhci autorun

      - name: Verify locked Lighthouse release budget
        run: node scripts/check-lighthouse-budget.mjs

      - name: Verify Lighthouse output present
        if: always()
        run: test -n "$(find .lighthouseci -type f -print -quit)"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
