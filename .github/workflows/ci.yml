name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-keypad-ownership-fix:
    name: Apply verified keypad ownership fix
    if: github.event_name == 'pull_request' && github.head_ref == 'claude/pr-134-security-review-0eqhdb'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Apply minimal ownership guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/02_security.js')
          s = p.read_text(encoding='utf-8')
          old = '''      try { ErrorHandler.logError("unlock-install-key", e); } catch (_) {}
                currentPin = "";
                updatePinDots();
                _setKeypadDisabled(false);
                // Lượt này đang giữ vé mà bỏ dở -> phải nhả UI dùng chung, nếu không màn khóa
                // kẹt ở trạng thái spinner (pipeline cũ nay không còn quyền tự dọn).
                _releaseUnlockLoading(myUnlockAttempt);
          '''
          new = '''      try { ErrorHandler.logError("unlock-install-key", e); } catch (_) {}
                if (myUnlockAttempt === __unlockAttemptSeq) {
                  currentPin = "";
                  updatePinDots();
                  _setKeypadDisabled(false);
                }
                // Lượt này đang giữ vé mà bỏ dở -> phải nhả UI dùng chung, nếu không màn khóa
                // kẹt ở trạng thái spinner (pipeline cũ nay không còn quyền tự dọn).
                _releaseUnlockLoading(myUnlockAttempt);
          '''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add deterministic regression coverage
        shell: bash
        run: |
          cat > tests/unlock-keypad-ownership.test.js <<'EOF'
          'use strict';

          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const { loadSecurity } = require('./helpers/load-security');

          function deferred() {
            let resolve;
            const promise = new Promise((res) => { resolve = res; });
            return { promise, resolve };
          }

          async function waitFor(promise, label) {
            await Promise.race([
              promise,
              new Promise((_, reject) => setTimeout(() => reject(new Error(`Hết thời gian chờ: ${label}`)), 3000)),
            ]);
          }

          test('lượt validatePin cũ không được mở keypad hoặc xóa PIN của lượt mới đang import khóa', async () => {
            const { api, localStorage, ctx, dom } = loadSecurity({ dom: true });
            const pin = '654321';
            const mk = api.generateMasterKey();

            await api.setMasterKey(mk);
            localStorage.setItem('app_pin', await api.sealMasterKey(pin, mk));
            api.clearMasterKeyMaterial();
            dom.getEl('screen-lock').classList.remove('hidden');

            const originalCrypto = ctx.crypto;
            const originalSubtle = originalCrypto.subtle;
            const entered = [deferred(), deferred()];
            const release = [deferred(), deferred()];
            let installCount = 0;

            ctx.crypto = {
              getRandomValues: originalCrypto.getRandomValues.bind(originalCrypto),
              subtle: new Proxy(originalSubtle, {
                get(target, prop) {
                  if (prop === 'importKey') {
                    return async (...args) => {
                      const algorithm = args[2];
                      const name = String((algorithm && algorithm.name) || algorithm || '');
                      if (name === 'AES-GCM' && installCount < 2) {
                        const index = installCount++;
                        entered[index].resolve();
                        await release[index].promise;
                      }
                      return target.importKey(...args);
                    };
                  }
                  const value = target[prop];
                  return typeof value === 'function' ? value.bind(target) : value;
                },
              }),
            };

            api.setCurrentPin(pin);
            const first = api.validatePin();
            await waitFor(entered[0].promise, 'lượt cũ vào importKey');

            api.setCurrentPin(pin);
            const second = api.validatePin();
            await waitFor(entered[1].promise, 'lượt mới vào importKey');

            const keypad = dom.getEl('pin-keypad');
            assert.equal(keypad.classList.contains('keypad-disabled'), true,
              'lượt mới đang import khóa phải giữ keypad bị vô hiệu hóa');

            release[0].resolve();
            await first;

            assert.equal(keypad.classList.contains('keypad-disabled'), true,
              'catch của lượt cũ không được bật lại keypad dùng chung');
            assert.equal(api.getCurrentPin(), pin,
              'catch của lượt cũ không được xóa PIN mà lượt mới còn cần cho pipeline');

            release[1].resolve();
            await second;

            assert.equal(keypad.classList.contains('keypad-disabled'), false,
              'lượt hiện hành hoàn tất thì tự trả keypad về trạng thái nhập được');
            assert.equal(api.getCurrentPin(), '', 'lượt hiện hành phải tự xóa PIN khỏi RAM');
          });

          test('tripwire: catch cài khóa của validatePin chỉ reset PIN/keypad khi còn sở hữu vé', () => {
            const source = fs.readFileSync(
              path.join(__dirname, '..', 'assets', '02_security.js'),
              'utf8'
            );
            const start = source.indexOf('async function validatePin()');
            const end = source.indexOf('\nfunction _openForcedPinUpgrade()', start);
            assert.ok(start >= 0 && end > start, 'phải tìm thấy thân validatePin');

            const body = source.slice(start, end);
            const install = body.indexOf('await _installMasterKey(res.masterKey)');
            const catchStart = body.indexOf('} catch (e) {', install);
            const catchReturn = body.indexOf('\n      return;', catchStart);
            assert.ok(install >= 0 && catchStart > install && catchReturn > catchStart,
              'phải tìm thấy catch của bước cài master key');

            const catchBody = body.slice(catchStart, catchReturn);
            assert.match(catchBody,
              /if\s*\(myUnlockAttempt\s*===\s*__unlockAttemptSeq\)\s*\{[\s\S]*?currentPin\s*=\s*"";[\s\S]*?updatePinDots\(\);[\s\S]*?_setKeypadDisabled\(false\);[\s\S]*?\}/,
              'reset PIN/keypad dùng chung phải nằm trong guard sở hữu vé');
          });
          EOF

      - name: Verify complete unit suite and patch hygiene
        run: |
          npm test
          git diff --check

      - name: Commit fix and restore workflow files
        shell: bash
        run: |
          git checkout 7268dbe6f934dd8e13c69ead73b85f4d068f1dbb -- .github/workflows/ci.yml
          git rm .github/workflows/pr136-keypad-ownership-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/02_security.js tests/unlock-keypad-ownership.test.js .github/workflows/ci.yml
          git commit -m "fix: preserve keypad ownership across stale unlocks"
          git push origin HEAD:claude/pr-134-security-review-0eqhdb

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool vercel.json  > /dev/null

      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          find assets scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Verify version single-source (package.json → manifest/sw/pwa/README)
        run: node scripts/sync-version.mjs --check

      # Debug scaffold + cache-buster + self-host policy — cùng script để dev chạy local được.
      - name: Verify repo policy (debug scaffold / cache-buster / self-host)
        run: node scripts/check-policy.mjs

  tests:
    name: Automated tests (crypto & data integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Không cần `npm install`: bộ test chạy bằng test runner tích hợp của Node
      # (node --test) + node:crypto (WebCrypto) + crypto-js.min.js self-host sẵn.
      # Không thêm dependency, không thêm asset -> không đụng versioning/cache-buster.
      - name: Run test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'

  e2e:
    name: E2E + a11y + Lighthouse (Playwright/axe/LHCI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Cache npm + Chromium theo devDeps đã pin exact trong package.json
      # (không có lockfile — chính sách no-lockfile giữ nguyên).
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}

      # devDeps CHỈ cho CI (Playwright/axe/Lighthouse). App shipped vẫn zero-dependency.
      # Dùng `npm install` (không `npm ci`) vì không commit package-lock.json.
      - name: Install CI test tooling
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E + axe a11y
        run: npx playwright test

      # Gate thật: assertion a11y (error, minScore 0.9) trong lighthouserc.json
      # làm đỏ CI nếu vi phạm; perf/best-practices vẫn chỉ cảnh báo.
      - name: Lighthouse CI (a11y gate + perf/best-practices cảnh báo)
        run: npx lhci autorun

      - name: Upload E2E & Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lighthouse-reports
          path: |
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
