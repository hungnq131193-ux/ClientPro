name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool vercel.json > /dev/null
          node --check sw.js
          find assets scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
          node scripts/sync-version.mjs --check
          node scripts/check-policy.mjs

  tests:
    name: Automated tests (crypto & data integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test 'tests/**/*.test.js'

  apply-migration-envelope-fix:
    name: Apply verified migration-envelope commit fix
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Apply recovery-stage and finalize ordering fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('assets/02_security.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('async function runFieldCryptoMigrationIfNeeded(')
          end_marker = '\n// ============================================================\n// PIN Envelope v2'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('migration function boundaries not found')

          fn = dedent('''
          async function runFieldCryptoMigrationIfNeeded(pin, employeeId, unlockAttempt) {
            if (typeof db === "undefined" || !db) return;
            if (localStorage.getItem(SCHEMA_KEY) === "2") return;
            const attemptCurrent = () => unlockAttempt === undefined || unlockAttempt === __unlockAttemptSeq;
            const recoveryId = String(employeeId || "").trim();
            if (!attemptCurrent()) return;

            // Crash sau khi đổi PIN_KEY nhưng trước marker: chỉ hoàn tất khi recovery
            // cũng mở đúng khóa hiện hành. Stage còn lại là commit record ưu tiên để sửa.
            if (!masterKeyLegacy && masterCryptoKey) {
              if (!attemptCurrent()) return;
              const pinCurrent = localStorage.getItem(PIN_KEY) || "";
              if (!parseV2Envelope(pinCurrent)) return;

              const pinStageCurrent = localStorage.getItem(PIN_STAGE) || "";
              let secStageCurrent = localStorage.getItem(SEC_STAGE) || "";
              let secCurrent = localStorage.getItem(SEC_KEY) || "";
              const stagedPairCommitted = !!pinStageCurrent && !!secStageCurrent
                && pinCurrent === pinStageCurrent && secCurrent === secStageCurrent
                && !!parseV2Envelope(pinStageCurrent) && !!parseV2Envelope(secStageCurrent);

              if (!stagedPairCommitted) {
                if (!recoveryId) throw new Error("LEGACY_MIGR_EMPLOYEE_ID_MISSING");
                let recovered = null;
                if (parseV2Envelope(secCurrent)) {
                  recovered = await openMasterKeyV2(recoveryId, secCurrent);
                  if (!attemptCurrent()) return;
                }
                if (recovered !== masterKey) {
                  let stagedRecovery = null;
                  if (parseV2Envelope(secStageCurrent)) {
                    stagedRecovery = await openMasterKeyV2(recoveryId, secStageCurrent);
                    if (!attemptCurrent()) return;
                  }
                  if (stagedRecovery !== masterKey) {
                    secStageCurrent = await sealMasterKey(recoveryId, masterKey);
                    if (!attemptCurrent()) return;
                    localStorage.setItem(SEC_STAGE, secStageCurrent);
                    if ((localStorage.getItem(SEC_STAGE) || "") !== secStageCurrent) {
                      throw new Error("LEGACY_MIGR_SEC_STAGE_WRITE_FAILED");
                    }
                    stagedRecovery = await openMasterKeyV2(recoveryId, secStageCurrent);
                    if (!attemptCurrent()) return;
                    if (stagedRecovery !== masterKey) throw new Error("LEGACY_MIGR_SEC_STAGE_MISMATCH");
                  }
                  localStorage.setItem(SEC_KEY, secStageCurrent);
                  if ((localStorage.getItem(SEC_KEY) || "") !== secStageCurrent) {
                    throw new Error("LEGACY_MIGR_SEC_WRITE_FAILED");
                  }
                  secCurrent = secStageCurrent;
                }
              }

              if (!parseV2Envelope(secCurrent)) throw new Error("LEGACY_MIGR_SEC_NOT_V2");
              localStorage.setItem(SCHEMA_KEY, "2");
              if (localStorage.getItem(SCHEMA_KEY) !== "2") throw new Error("LEGACY_MIGR_SCHEMA_WRITE_FAILED");
              localStorage.removeItem(PIN_STAGE); localStorage.removeItem(SEC_STAGE);
              __legacyMigrationUnfinished = false;
              return;
            }
            if (!masterKeyLegacy) return;

            const legacyKey = masterKeyLegacy;
            let mkStr = null;
            let pinStage = localStorage.getItem(PIN_STAGE) || "";
            if (pinStage) {
              mkStr = await openMasterKeyV2(pin, pinStage);
              if (!attemptCurrent()) return;
            }
            if (!mkStr) {
              mkStr = generateMasterKey();
              pinStage = await sealMasterKey(pin, mkStr);
              if (!attemptCurrent()) return;
              localStorage.setItem(PIN_STAGE, pinStage);
              if ((localStorage.getItem(PIN_STAGE) || "") !== pinStage) {
                throw new Error("LEGACY_MIGR_PIN_STAGE_WRITE_FAILED");
              }
            }

            // Recovery stage là bắt buộc và phải mở CÙNG mkStr. Resume với PIN_STAGE
            // nhưng thiếu/hỏng SEC_STAGE sẽ dựng lại trước khi cài khóa hoặc sửa record.
            if (!recoveryId) throw new Error("LEGACY_MIGR_EMPLOYEE_ID_MISSING");
            let secStage = localStorage.getItem(SEC_STAGE) || "";
            let stagedRecovery = null;
            if (parseV2Envelope(secStage)) {
              stagedRecovery = await openMasterKeyV2(recoveryId, secStage);
              if (!attemptCurrent()) return;
            }
            if (stagedRecovery !== mkStr) {
              secStage = await sealMasterKey(recoveryId, mkStr);
              if (!attemptCurrent()) return;
              localStorage.setItem(SEC_STAGE, secStage);
              if ((localStorage.getItem(SEC_STAGE) || "") !== secStage) {
                throw new Error("LEGACY_MIGR_SEC_STAGE_WRITE_FAILED");
              }
              stagedRecovery = await openMasterKeyV2(recoveryId, secStage);
              if (!attemptCurrent()) return;
              if (stagedRecovery !== mkStr) throw new Error("LEGACY_MIGR_SEC_STAGE_MISMATCH");
            }

            if (!attemptCurrent()) return;
            await _installMasterKey(mkStr);
            const migrationGen = __keyGeneration;
            if (!_legacyMigrationAlive(migrationGen, unlockAttempt) || masterKey !== mkStr) {
              throw new Error("LEGACY_MIGR_KEY_INSTALL_ABORTED");
            }
            masterKeyLegacy = legacyKey;
            __legacyMigrationUnfinished = true;

            const ids = await _getAllCustomerKeys();
            if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
            for (const id of ids) {
              if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
              const c = await new Promise((resolve, reject) => {
                try {
                  const g = db.transaction(["customers"], "readonly").objectStore("customers").get(id);
                  g.onsuccess = () => resolve(g.result);
                  g.onerror = () => reject(g.error || new Error("LEGACY_MIGR_RECORD_READ_ERROR"));
                } catch (e) { reject(e); }
              });
              if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
              if (!c || c.cryptoV === 2) continue;
              await _reencryptRecord(c, legacyKey, migrationGen, unlockAttempt);
              if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
              await new Promise((resolve, reject) => {
                const tx = db.transaction(["customers"], "readwrite");
                tx.objectStore("customers").put(c);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error || new Error("LEGACY_MIGR_TX_ERROR"));
                tx.onabort = () => reject(tx.error || new Error("LEGACY_MIGR_TX_ABORT"));
              });
              if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
            }

            await _migrateDriveToken(legacyKey, migrationGen, unlockAttempt);
            if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");

            pinStage = localStorage.getItem(PIN_STAGE) || "";
            secStage = localStorage.getItem(SEC_STAGE) || "";
            if (!parseV2Envelope(pinStage)) throw new Error("LEGACY_MIGR_PIN_STAGE_MISSING");
            if (!parseV2Envelope(secStage)) throw new Error("LEGACY_MIGR_SEC_STAGE_MISSING");

            const stagedPinKey = await openMasterKeyV2(pin, pinStage);
            if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
            if (stagedPinKey !== mkStr) throw new Error("LEGACY_MIGR_PIN_STAGE_MISMATCH");
            const stagedSecKey = await openMasterKeyV2(recoveryId, secStage);
            if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
            if (stagedSecKey !== mkStr) throw new Error("LEGACY_MIGR_SEC_STAGE_MISMATCH");

            // Recovery được commit trước. PIN_KEY là tín hiệu resume-after-swap cuối cùng;
            // nếu SEC write lỗi thì daily PIN vẫn giữ legacy key và stage còn nguyên.
            localStorage.setItem(SEC_KEY, secStage);
            if ((localStorage.getItem(SEC_KEY) || "") !== secStage) throw new Error("LEGACY_MIGR_SEC_WRITE_FAILED");
            if (!_legacyMigrationAlive(migrationGen, unlockAttempt)) throw new Error("STALE_KEY_GENERATION");
            localStorage.setItem(PIN_KEY, pinStage);
            if ((localStorage.getItem(PIN_KEY) || "") !== pinStage) throw new Error("LEGACY_MIGR_PIN_WRITE_FAILED");
            if ((localStorage.getItem(SEC_KEY) || "") !== secStage) throw new Error("LEGACY_MIGR_SEC_COMMIT_LOST");

            localStorage.setItem(SCHEMA_KEY, "2");
            if (localStorage.getItem(SCHEMA_KEY) !== "2") throw new Error("LEGACY_MIGR_SCHEMA_WRITE_FAILED");
            localStorage.removeItem(PIN_STAGE); localStorage.removeItem(SEC_STAGE);
            masterKeyLegacy = null;
            __legacyMigrationUnfinished = false;
          }
          ''').strip()
          s = s[:start] + fn + '\n' + s[end:]
          p.write_text(s, encoding='utf-8')

          test_path = Path('tests/legacy-migration-envelope-commit.test.js')
          test_path.write_text(dedent(r'''
          'use strict';

          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const { loadSecurity } = require('./helpers/load-security');

          function emptyCustomerDb() {
            return {
              transaction() {
                return {
                  objectStore() {
                    return {
                      getAllKeys() {
                        const req = { onsuccess: null, onerror: null, result: [] };
                        Promise.resolve().then(() => {
                          if (req.onsuccess) req.onsuccess({ target: req });
                        });
                        return req;
                      },
                    };
                  },
                };
              },
            };
          }

          test('resume PIN_STAGE thiếu SEC_STAGE phải dựng lại recovery cùng master key', async () => {
            const { api, localStorage } = loadSecurity();
            const legacyKey = 'mk_legacy_recovery_resume';
            const nextKey = api.generateMasterKey();
            const pin = '654321';
            const employeeId = 'NV001';
            api.setLegacyMasterKey(legacyKey);
            api.setDb(emptyCustomerDb());
            localStorage.setItem('app_pin', 'legacy-pin-envelope');
            localStorage.setItem('app_sec_qa', 'legacy-sec-envelope');
            const pinStage = await api.sealMasterKey(pin, nextKey);
            localStorage.setItem('app_pin_v2_stage', pinStage);

            await api.runFieldCryptoMigrationIfNeeded(pin, employeeId);

            assert.equal(localStorage.getItem('app_crypto_schema_v'), '2');
            assert.equal(localStorage.getItem('app_pin'), pinStage);
            const sec = localStorage.getItem('app_sec_qa');
            assert.ok(api.parseV2Envelope(sec), 'recovery envelope phải là v2');
            assert.equal(await api.openMasterKeyV2(employeeId, sec), nextKey,
              'recovery phải mở đúng key đã stage cho PIN');
            assert.equal(localStorage.getItem('app_pin_v2_stage'), null);
            assert.equal(localStorage.getItem('app_sec_v2_stage'), null);
          });

          test('SEC_KEY write lỗi không được chuyển PIN_KEY và phải giữ cả stage để retry', async () => {
            const { api, localStorage } = loadSecurity();
            const legacyKey = 'mk_legacy_commit_order';
            const oldPin = 'legacy-pin-envelope';
            const oldSec = 'legacy-sec-envelope';
            api.setLegacyMasterKey(legacyKey);
            api.setDb(emptyCustomerDb());
            localStorage.setItem('app_pin', oldPin);
            localStorage.setItem('app_sec_qa', oldSec);

            const originalSet = localStorage.setItem.bind(localStorage);
            localStorage.setItem = (key, value) => {
              if (key === 'app_sec_qa') throw new Error('simulated quota failure');
              return originalSet(key, value);
            };

            await assert.rejects(
              api.runFieldCryptoMigrationIfNeeded('654321', 'NV001'),
              /simulated quota failure/
            );

            assert.equal(localStorage.getItem('app_pin'), oldPin,
              'PIN_KEY phải còn legacy khi recovery chưa commit được');
            assert.equal(localStorage.getItem('app_sec_qa'), oldSec);
            assert.ok(localStorage.getItem('app_pin_v2_stage'), 'PIN stage phải giữ để retry');
            assert.ok(localStorage.getItem('app_sec_v2_stage'), 'SEC stage phải giữ để retry');
            assert.equal(localStorage.getItem('app_crypto_schema_v'), null);
          });

          test('tripwire: recovery commit đứng trước PIN và stage chỉ xóa sau xác minh', () => {
            const source = fs.readFileSync(path.join(__dirname, '..', 'assets', '02_security.js'), 'utf8');
            const start = source.indexOf('async function runFieldCryptoMigrationIfNeeded(');
            const end = source.indexOf('\n// ============================================================\n// PIN Envelope v2', start);
            assert.ok(start >= 0 && end > start);
            const body = source.slice(start, end);
            const secWrite = body.lastIndexOf('localStorage.setItem(SEC_KEY, secStage)');
            const secVerify = body.lastIndexOf('localStorage.getItem(SEC_KEY)');
            const pinWrite = body.lastIndexOf('localStorage.setItem(PIN_KEY, pinStage)');
            const schemaWrite = body.lastIndexOf('localStorage.setItem(SCHEMA_KEY, "2")');
            const removeStages = body.lastIndexOf('localStorage.removeItem(PIN_STAGE)');
            assert.ok(secWrite >= 0 && secVerify > secWrite && pinWrite > secVerify,
              'SEC_KEY phải ghi và đọc lại trước PIN_KEY');
            assert.ok(schemaWrite > pinWrite && removeStages > schemaWrite,
              'chỉ xóa stage sau khi hai envelope và schema đã commit');
            assert.match(body, /if \(!recoveryId\) throw new Error\("LEGACY_MIGR_EMPLOYEE_ID_MISSING"\)/);
            assert.match(body, /stagedRecovery !== mkStr[\s\S]*?sealMasterKey\(recoveryId, mkStr\)/,
              'SEC_STAGE thiếu hoặc lệch phải được dựng lại từ recovery identity');
          });
          ''').strip() + '\n', encoding='utf-8')
          PY
      - name: Verify full suite and patch hygiene
        run: |
          node --check assets/02_security.js
          node --test 'tests/**/*.test.js'
          git diff --check
      - name: Commit verified code and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/02_security.js tests/legacy-migration-envelope-commit.test.js
          git commit -m "fix: commit migration recovery before PIN"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  e2e:
    name: E2E + a11y + Lighthouse (Playwright/axe/LHCI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npx lhci autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lighthouse-reports
          path: |
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
