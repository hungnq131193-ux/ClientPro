name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool vercel.json  > /dev/null

      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          find assets scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Verify version single-source (package.json → manifest/sw/pwa/README)
        run: node scripts/sync-version.mjs --check

      # Debug scaffold + cache-buster + self-host policy — cùng script để dev chạy local được.
      - name: Verify repo policy (debug scaffold / cache-buster / self-host)
        run: node scripts/check-policy.mjs

  tests:
    name: Automated tests (crypto & data integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Không cần `npm install`: bộ test chạy bằng test runner tích hợp của Node
      # (node --test) + node:crypto (WebCrypto) + crypto-js.min.js self-host sẵn.
      # Không thêm dependency, không thêm asset -> không đụng versioning/cache-buster.
      - name: Run test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'

  e2e:
    name: E2E + a11y + Lighthouse (Playwright/axe/LHCI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Cache npm + Chromium theo package-lock.json (CI tooling only;
      # app shipped vẫn zero-dependency runtime).
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # devDeps CHỈ cho CI (Playwright/axe/Lighthouse). App shipped vẫn zero-dependency.
      # `npm ci` + package-lock.json đã commit để dependency test không trôi.
      - name: Install CI test tooling
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E + axe a11y
        run: npx playwright test

      # Gate: a11y + best-practices (error); performance vẫn warn một release.
      - name: Lighthouse CI (a11y + best-practices gate; perf cảnh báo)
        run: npx lhci autorun

      # .lighthouseci/ là thư mục ẩn — upload-artifact@v4 bỏ qua hidden files
      # trừ khi bật include-hidden-files. Tách upload để mất LHCI không bị
      # che bởi playwright-report/ đã có sẵn.
      - name: Verify Lighthouse output present
        if: always()
        run: test -n "$(find .lighthouseci -type f -print -quit)"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
