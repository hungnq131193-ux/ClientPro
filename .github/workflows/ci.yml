name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool vercel.json  > /dev/null

      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          find assets scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Verify version single-source (package.json → manifest/sw/pwa/README)
        run: node scripts/sync-version.mjs --check

      # Debug scaffold + cache-buster + self-host policy — cùng script để dev chạy local được.
      - name: Verify repo policy (debug scaffold / cache-buster / self-host)
        run: node scripts/check-policy.mjs

  tests:
    name: Automated tests (crypto & data integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Không cần `npm install`: bộ test chạy bằng test runner tích hợp của Node
      # (node --test) + node:crypto (WebCrypto) + crypto-js.min.js self-host sẵn.
      # Không thêm dependency, không thêm asset -> không đụng versioning/cache-buster.
      - name: Run test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'

  apply-stale-install-fix:
    name: Apply verified stale-install invalidation
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Apply stale install ownership fix and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          security = Path('assets/02_security.js')
          text = security.read_text(encoding='utf-8')
          old = """    if (myUnlockAttempt !== __unlockAttemptSeq) return;
              const pinForMigration = pinAttempt;""".replace('          ', '')
          new = """    const installedGeneration = __keyGeneration;
              const installedCryptoKey = masterCryptoKey;
              if (myUnlockAttempt !== __unlockAttemptSeq) {
                if (__keyGeneration === installedGeneration
                  && masterKey === res.masterKey
                  && masterCryptoKey === installedCryptoKey) {
                  clearMasterKeyMaterial();
                }
                return;
              }
              const pinForMigration = pinAttempt;""".replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'validatePin target count={text.count(old)}')
          security.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/unlock-keypad-ownership.test.js')
          t = tests.read_text(encoding='utf-8')
          marker = "test('tripwire: validatePin nhận vé và chụp PIN trước unwrap, cleanup chỉ thuộc chủ vé', () => {"
          if t.count(marker) != 1:
              raise SystemExit(f'tripwire marker count={t.count(marker)}')
          added = """test('lượt cũ mất vé sau importKey phải xóa khóa của chính nó khi lượt mới nhập sai PIN', async () => {
            const { api, localStorage, ctx, dom } = loadSecurity({ dom: true });
            const correctPin = '654321';
            const wrongPin = '111111';
            const mk = api.generateMasterKey();

            await api.setMasterKey(mk);
            localStorage.setItem('app_pin', await api.sealMasterKey(correctPin, mk));
            api.clearMasterKeyMaterial();
            dom.getEl('screen-lock').classList.remove('hidden');
            const failuresBefore = api.getPinFailures().fails;

            const originalCrypto = ctx.crypto;
            const subtle = originalCrypto.subtle;
            const firstInstallEntered = deferred();
            const releaseFirstInstall = deferred();
            const secondUnwrapEntered = deferred();
            const releaseSecondUnwrap = deferred();
            let aesInstallCount = 0;
            let pbkdf2DeriveCount = 0;

            ctx.crypto = {
              getRandomValues: originalCrypto.getRandomValues.bind(originalCrypto),
              subtle: new Proxy(subtle, {
                get(target, prop) {
                  if (prop === 'deriveKey') {
                    return async (...args) => {
                      const algorithm = args[0];
                      const name = String((algorithm && algorithm.name) || algorithm || '');
                      if (name === 'PBKDF2') {
                        pbkdf2DeriveCount++;
                        if (pbkdf2DeriveCount === 2) {
                          secondUnwrapEntered.resolve();
                          await releaseSecondUnwrap.promise;
                        }
                      }
                      return target.deriveKey(...args);
                    };
                  }
                  if (prop === 'importKey') {
                    return async (...args) => {
                      const algorithm = args[2];
                      const name = String((algorithm && algorithm.name) || algorithm || '');
                      if (name === 'AES-GCM') {
                        aesInstallCount++;
                        if (aesInstallCount === 1) {
                          firstInstallEntered.resolve();
                          await releaseFirstInstall.promise;
                        }
                      }
                      return target.importKey(...args);
                    };
                  }
                  const value = target[prop];
                  return typeof value === 'function' ? value.bind(target) : value;
                },
              }),
            };

            api.setCurrentPin(correctPin);
            const first = api.validatePin();
            await waitFor(firstInstallEntered.promise, 'lượt đúng PIN vào cài khóa');

            api.setCurrentPin(wrongPin);
            const second = api.validatePin();
            await waitFor(secondUnwrapEntered.promise, 'lượt sai PIN vào PBKDF2');

            releaseFirstInstall.resolve();
            await first;

            assert.equal(api.isAppUnlocked(), false,
              'lượt cũ mất vé phải xóa masterKey vừa cài, không để phiên mở khóa phía sau màn PIN');
            assert.equal(api.getState().hasGcmKey, false,
              'khóa GCM của lượt cũ phải bị vô hiệu hóa cùng masterKey');
            assert.equal(dom.isHidden('screen-lock'), false,
              'màn khóa phải tiếp tục chặn trong khi lượt mới chưa xác thực xong');
            assert.equal(api.getCurrentPin(), wrongPin,
              'lượt cũ không được xóa PIN của lượt mới đang unwrap');

            releaseSecondUnwrap.resolve();
            await second;

            assert.equal(api.getPinFailures().fails, failuresBefore + 1,
              'lượt mới sai PIN vẫn phải được ghi nhận đúng một lần');
            assert.equal(api.isAppUnlocked(), false,
              'sau PIN sai không được còn vật liệu khóa từ lượt cũ');
            assert.equal(api.getState().hasGcmKey, false);
            assert.equal(dom.isHidden('screen-lock'), false);
          });

          """.replace('          ', '')
          t = t.replace(marker, added + marker)

          old_tripwire = """  const postInstallGuard = body.indexOf('if (myUnlockAttempt !== __unlockAttemptSeq) return;', install);
            const migrationPin = body.indexOf('const pinForMigration = pinAttempt;', postInstallGuard);
            const clearSharedPin = body.indexOf('currentPin = \"\";', migrationPin);
            assert.ok(postInstallGuard > install && migrationPin > postInstallGuard && clearSharedPin > migrationPin,
              'sau importKey phải kiểm vé lại và migration chỉ dùng PIN snapshot');""".replace('          ', '')
          new_tripwire = """  const installedGeneration = body.indexOf('const installedGeneration = __keyGeneration;', install);
            const installedCryptoKey = body.indexOf('const installedCryptoKey = masterCryptoKey;', installedGeneration);
            const postInstallGuard = body.indexOf('if (myUnlockAttempt !== __unlockAttemptSeq) {', installedCryptoKey);
            const migrationPin = body.indexOf('const pinForMigration = pinAttempt;', postInstallGuard);
            const clearSharedPin = body.indexOf('currentPin = \"\";', migrationPin);
            assert.ok(installedGeneration > install && installedCryptoKey > installedGeneration
                && postInstallGuard > installedCryptoKey && migrationPin > postInstallGuard
                && clearSharedPin > migrationPin,
              'sau importKey phải chụp identity khóa, kiểm vé lại và migration chỉ dùng PIN snapshot');

            const staleInstallBlock = body.slice(postInstallGuard, migrationPin);
            assert.match(staleInstallBlock,
              /__keyGeneration === installedGeneration[\\s\\S]*?masterKey === res\\.masterKey[\\s\\S]*?masterCryptoKey === installedCryptoKey[\\s\\S]*?clearMasterKeyMaterial\\(\\);[\\s\\S]*?return;/,
              'lượt mất vé phải chỉ xóa đúng generation/key mà chính nó vừa cài');""".replace('          ', '')
          if t.count(old_tripwire) != 1:
              raise SystemExit(f'tripwire target count={t.count(old_tripwire)}')
          tests.write_text(t.replace(old_tripwire, new_tripwire), encoding='utf-8')
          PY

      - name: Verify full unit suite and patch hygiene
        run: |
          node --check assets/02_security.js
          node --test 'tests/**/*.test.js'
          git diff --check

      - name: Commit verified code and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/02_security.js tests/unlock-keypad-ownership.test.js
          git commit -m "fix: invalidate stale unlock installs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  e2e:
    name: E2E + a11y + Lighthouse (Playwright/axe/LHCI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Cache npm + Chromium theo devDeps đã pin exact trong package.json
      # (không có lockfile — chính sách no-lockfile giữ nguyên).
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}

      # devDeps CHỈ cho CI (Playwright/axe/Lighthouse). App shipped vẫn zero-dependency.
      # Dùng `npm install` (không `npm ci`) vì không commit package-lock.json.
      - name: Install CI test tooling
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E + axe a11y
        run: npx playwright test

      # Gate thật: assertion a11y (error, minScore 0.9) trong lighthouserc.json
      # làm đỏ CI nếu vi phạm; perf/best-practices vẫn chỉ cảnh báo.
      - name: Lighthouse CI (a11y gate + perf/best-practices cảnh báo)
        run: npx lhci autorun

      - name: Upload E2E & Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lighthouse-reports
          path: |
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
