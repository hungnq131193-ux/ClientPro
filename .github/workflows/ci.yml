name: Apply recovery identity retry fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: recovery-identity-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Preserve recovery identity until migration finalizes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          security = Path('assets/02_security.js')
          source = security.read_text(encoding='utf-8')
          old = '''async function runEmployeeIdSealMigrationIfNeeded() {
            if (!masterCryptoKey) return;
            // Mã NV là secret khôi phục masterKey -> cũng phải theo thế hệ khóa: khóa/thu hồi'''.replace('          ', '')
          new = '''async function runEmployeeIdSealMigrationIfNeeded() {
            if (!masterCryptoKey) return;
            // Khi legacy migration chưa commit xong, plaintext mã NV là nguồn recovery
            // DUY NHẤT để dựng/kiểm SEC_STAGE ở lần retry. Không được seal+xóa nó sớm.
            const migrationSchemaDone = localStorage.getItem(SCHEMA_KEY) === "2";
            const legacyPinStillActive = isLegacyEnvelope(localStorage.getItem(PIN_KEY));
            const migrationStagePending = !!(localStorage.getItem(PIN_STAGE) || localStorage.getItem(SEC_STAGE));
            if (!migrationSchemaDone
              && (legacyPinStillActive || migrationStagePending || __legacyMigrationUnfinished)) return;
            // Mã NV là secret khôi phục masterKey -> cũng phải theo thế hệ khóa: khóa/thu hồi'''.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit(f'employee migration target count={source.count(old)}')
          security.write_text(source.replace(old, new), encoding='utf-8')

          tests = Path('tests/employee-id-seal.test.js')
          text = tests.read_text(encoding='utf-8')
          marker = "test('migration: seal plaintext -> xóa plaintext, RAM + sealed đọc lại đúng', async () => {"
          added = '''test('legacy migration chưa finalize phải giữ plaintext recovery identity để retry', async () => {
            const { api, localStorage } = loadSecurity();
            localStorage.setItem(PLAIN_KEY, EMP);
            localStorage.setItem('app_pin', 'legacy-pin-envelope');
            localStorage.setItem('app_pin_v2_stage', '{"v":2,"pending":true}');
            await api.setMasterKey(api.generateMasterKey());

            await api.runEmployeeIdSealMigrationIfNeeded();

            assert.equal(localStorage.getItem(PLAIN_KEY), EMP,
              'PIN còn legacy/stage còn pending thì phải giữ identity plaintext cho lần retry');
            assert.equal(localStorage.getItem(SEALED_KEY), null,
              'không được seal dưới MK2 chưa được PIN_KEY commit');

            localStorage.setItem('app_crypto_schema_v', '2');
            localStorage.removeItem('app_pin_v2_stage');
            await api.runEmployeeIdSealMigrationIfNeeded();

            assert.equal(localStorage.getItem(PLAIN_KEY), null,
              'sau finalize schema mới được xóa plaintext');
            assert.ok(localStorage.getItem(SEALED_KEY));
          });

          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit(f'test marker count={text.count(marker)}')
          tests.write_text(text.replace(marker, added + marker, 1), encoding='utf-8')
          PY
      - name: Verify targeted and full test suites
        run: |
          node --check assets/02_security.js
          node --test tests/employee-id-seal.test.js tests/legacy-migration-envelope-commit.test.js
          node --test 'tests/**/*.test.js'
          git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/02_security.js tests/employee-id-seal.test.js
          git commit -m "fix: preserve recovery identity for migration retry"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
