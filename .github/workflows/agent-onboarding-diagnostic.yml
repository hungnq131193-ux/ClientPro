name: Agent onboarding diagnostic

on:
  push:
    branches:
      - agent/security-hardening-tour-v1-5-0

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install test tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run onboarding E2E and capture full log
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          npx playwright test e2e/onboarding-tour.spec.js e2e/onboarding-auto-retry.spec.js --reporter=line > .diagnostics/onboarding-e2e.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> .diagnostics/onboarding-e2e.log
          exit 0
      - name: Commit diagnostic log
        run: |
          rm -f .github/workflows/agent-onboarding-diagnostic.yml
          git config user.name "ClientPro Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(test): capture onboarding E2E diagnostic"
          git push origin HEAD
